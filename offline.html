<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b6bcb">
  <title>MD Map – Ngoại tuyến</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f8fb;color:#142235;font:16px/1.55 "Segoe UI",Arial,sans-serif}.card{max-width:520px;background:#fff;border:1px solid #dbe3ec;border-radius:16px;padding:28px;box-shadow:0 14px 36px rgba(20,34,53,.12)}.icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:#eaf3ff;color:#0759aa;font-size:26px}h1{font-size:23px;margin:18px 0 8px}p{color:#64748b;margin:0 0 18px}button{border:0;border-radius:10px;background:#0b6bcb;color:#fff;font:inherit;font-weight:700;padding:11px 16px;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">⌖</div>
    <h1>Chưa có kết nối mạng</h1>
    <p>Phần giao diện và dữ liệu đã lưu trên máy vẫn có thể dùng. Nền bản đồ, tìm địa chỉ, cao độ, tuyến đường và Sentinel-2 cần kết nối Internet.</p>
    <button type="button" onclick="location.reload()">Thử kết nối lại</button>
  </main>
</body>
</html>
